name: Обновить скидки
on:
  schedule:
    - cron: '30 5 * * 1'   # понедельник 05:30 UTC
    - cron: '30 5 * * 2'   # вторник (если в понедельник листовка ещё не вышла)
  workflow_dispatch:        # кнопка «Run workflow» вручную
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node update-deals.mjs
      - name: Сохранить deals.json
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || (git commit -m "Скидки: обновление" && git push)
 
